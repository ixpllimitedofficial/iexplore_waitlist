name: Public sharing checks

on:
  pull_request:
  push:
    branches: [main, feat/64-public-sharing-pages]

permissions:
  contents: read

concurrency:
  group: sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:sharing
